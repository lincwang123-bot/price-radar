# Test-only directive fixture, not a deployable gateway configuration.
map $args $airadar_cache_args {
    default $is_args$args;
    "" "";
    ~*^(?:(?:utm_[a-z0-9_]+|gclid|dclid|fbclid|msclkid|gbraid|wbraid)=[^&]*)(?:&(?:utm_[a-z0-9_]+|gclid|dclid|fbclid|msclkid|gbraid|wbraid)=[^&]*)*$ "";
}
map "$radar_log_route:$http_user_agent" $radar_crawler_claim {
    default "other";
    ~*^[^:]+:.*(Googlebot|Google-InspectionTool|Google-Extended|GoogleOther) "google";
    ~*^[^:]+:.*(bingbot|msnbot|BingPreview|adidxbot) "bing";
    ~*^[^:]+:.*GPTBot "openai-gptbot";
    ~*^[^:]+:.*(GrokBot|xAI-SearchBot|xAI-Bot) "xai";
    ~*^[^:]+:.*(ClaudeBot|anthropic-ai) "claude";
    ~*^[^:]+:.*OAI-SearchBot "openai-search";
    ~*^[^:]+:.*ChatGPT-User "openai-user";
    ~*^[^:]+:.*Claude-SearchBot "claude-search";
    ~*^[^:]+:.*Claude-User "claude-user";
    ~*^[^:]+:.*(PerplexityBot|Perplexity-User) "perplexity";
    ~*^[^:]+:.*Applebot "apple";
    ~*^[^:]+:.*CCBot "commoncrawl";
    ~*^[^:]+:.*Baiduspider "baidu";
    ~*^[^:]+:.*(YandexBot|YandexImages|YandexRenderResourcesBot) "yandex";
    ~*^[^:]+:.*(DuckDuckBot|DuckAssistBot) "duckduckgo";
    ~*^[^:]+:.*Bytespider "bytespider";
    ~*^[^:]+:.*(meta-externalagent|Meta-ExternalFetcher) "meta";
    ~*^[^:]+:.*Amazonbot "amazon";
}
# Cookie names only: cf_clearance __cf_bm _cfuvid airadar_hv
limit_req_zone $binary_remote_addr zone=radar_cache_total:1m rate=2000r/s;
location ~* ^/assets/.*\.(png|jpe?g|webp|gif|svg|ico)$ {
    proxy_pass http://radar_web_keepalive;
}
location @radar_busy { return 429; }
location / {
    proxy_cache_valid 200 30s;
    proxy_cache_use_stale updating error timeout;
    proxy_cache_lock on;
    proxy_read_timeout 15s;
    proxy_ignore_headers Cache-Control Expires;
    limit_conn radar_conn_total 400;
    add_header Cache-Control "no-store" always;
    proxy_cache_key "$request_method$host$uri$airadar_cache_args";
}
